{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <!-- Heading -->
    <h2 class="text-center mb-5 fw-bold">📊 Dashboard</h2>

    <!-- Cards -->
    <div class="row g-4 text-center">

        <!-- Total -->
        <div class="col-md-4">
            <div class="card shadow-lg border-0 p-4">
                <h6 class="text-muted">Total Complaints</h6>
                <h2 class="fw-bold text-primary">{{ total }}</h2>
            </div>
        </div>

        <!-- Pending -->
        <div class="col-md-4">
            <div class="card shadow-lg border-0 p-4">
                <h6 class="text-muted">Pending</h6>
                <h2 class="fw-bold text-warning">{{ pending }}</h2>
            </div>
        </div>

        <!-- Resolved -->
        <div class="col-md-4">
            <div class="card shadow-lg border-0 p-4">
                <h6 class="text-muted">Resolved</h6>
                <h2 class="fw-bold text-success">{{ resolved }}</h2>
            </div>
        </div>

    </div>

    <!-- Actions -->
    <div class="text-center mt-5">

        <a href="{% url 'add_complaint' %}" class="btn btn-success px-4 py-2 m-2 shadow">
            ➕ Add Complaint
        </a>

        <a href="{% url 'view_complaints' %}" class="btn btn-primary px-4 py-2 m-2 shadow">
            📋 View Complaints
        </a>

        <a href="{% url 'fee' %}" class="btn btn-warning px-4 py-2 m-2 shadow">
            💰 Fee
        </a>

    </div>

</div>

{% endblock %}
